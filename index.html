<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squeeze — Everything you need for your files</title>
<meta name="description" content="Squeeze: compress, convert, merge, edit and transform your files in one simple place.">
<style>
:root{--y:#FACC15;--y2:#EAB308;--ink:#18181B;--mut:#52525B;--bg:#FAFAFA;--card:#fff;--line:#EEEEF0;--soft:#FEF9C3;--bad:#B91C1C;--badbg:#FEF2F2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#FAFAFA;--mut:#A1A1AA;--bg:#121214;--card:#1B1B1F;--line:#2C2C31;--soft:#2A2509;--badbg:#2A1212;--bad:#F87171}}
:root[data-theme="dark"]{--ink:#FAFAFA;--mut:#A1A1AA;--bg:#121214;--card:#1B1B1F;--line:#2C2C31;--soft:#2A2509;--badbg:#2A1212;--bad:#F87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--y2);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--y);display:grid;place-items:center;color:#18181B}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--mut);white-space:nowrap;transition:.15s}
nav a:hover{background:var(--card);color:var(--ink)}
nav a[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--y);color:#18181B;font:600 15px inherit;font-family:inherit;border:0;padding:11px 20px;border-radius:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--y2);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg);border-color:var(--y2)}
.hero{padding:88px 0 56px;text-align:center}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--y);padding:4px 14px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:22px}
h1{font-size:clamp(40px,7vw,72px);line-height:1.05;letter-spacing:-.035em;margin:0 0 18px;font-weight:800}
h1 mark{background:linear-gradient(transparent 62%,var(--y) 62%);color:inherit}
.lead{max-width:560px;margin:0 auto 32px;color:var(--mut);font-size:19px}
.hero .btn{padding:15px 30px;font-size:17px}
h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.025em;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 32px;font-size:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--y);box-shadow:0 12px 28px -12px rgba(0,0,0,.18)}
.ic{width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center;margin-bottom:16px}
.ic svg,.logo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.card p{margin:0;color:var(--mut);font-size:15px}
.card .go{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:14px;font-weight:600}
.card.tool{padding:20px}.card.tool .ic{width:40px;height:40px;margin-bottom:12px}
section.page{padding:56px 0 80px}
.crumb{font-size:14px;color:var(--mut);margin-bottom:14px}.crumb a:hover{color:var(--ink);text-decoration:underline}
.panel{max-width:720px;margin:0 auto}
.route{display:flex;justify-content:center;align-items:center;gap:14px;margin:8px 0 28px}
.ft{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.ft:first-child{background:var(--soft);border-color:var(--y)}
.drop{background:var(--card);border:2px dashed #D4D4D8;border-radius:24px;padding:56px 24px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--y2);background:var(--soft)}
.drop h3{font-size:22px;margin:12px 0 4px}.drop p{color:var(--mut);margin:0 0 18px}
.drop small{display:block;margin-top:16px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:20px}
.file{display:flex;gap:14px;align-items:center}
.file b{display:block;word-break:break-all}.file span{color:var(--mut);font-size:14px}
.file .x{margin-left:auto}
label.f{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input[type=range]{width:100%;accent-color:var(--y2)}
input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--y);border-radius:99px;transition:width .2s}
.bar.ind i{width:40%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 20px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:13px;color:var(--mut)}
.stats .hl{background:var(--soft);border-color:var(--y)}
.err{background:var(--badbg);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:15px}
.note{background:var(--soft);border-radius:14px;padding:12px 16px;margin-top:16px;font-size:14px;color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);background:var(--card);padding:44px 0 32px}
.fgrid{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.fl{display:flex;flex-wrap:wrap;gap:6px 20px;max-width:520px}.fl a{color:var(--mut);font-size:14.5px}.fl a:hover{color:var(--ink)}
.copy{margin-top:32px;color:var(--mut);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:720px){.nav{gap:12px}.logo span{display:none}.hero{padding:56px 0 36px}.stats{grid-template-columns:1fr}.btn.top{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<header><div class="wrap nav">
<a class="logo" href="#/" aria-label="Squeeze home"><i><svg viewBox="0 0 24 24"><path d="M4 8l5 4-5 4M20 8l-5 4 5 4M12 4v16"/></svg></i><span>Squeeze</span></a>
<nav id="nav" aria-label="Main"></nav>
<a class="btn top" href="#/tools">All Tools</a>
</div></header>
<main id="main" class="wrap" tabindex="-1" style="outline:0"></main>
<footer><div class="wrap">
<div class="fgrid"><div><div class="logo">Squeeze</div><p style="color:var(--mut);margin:6px 0 0">Everything you need for your files.</p></div>
<div class="fl" id="fl"></div></div>
<div class="copy">© 2026 Squeeze. All rights reserved.</div></div></footer>

<script>
/* ============ CONFIG ============
   Set API_BASE to your file-processing backend, e.g. "https://api.example.com".
   Tools with engine "api" POST multipart/form-data to `${API_BASE}/v1/${toolId}`
   (fields: file, plus options) and expect the processed file as the response body. */
const CONFIG={API_BASE:"",MAX_MB:100};

/* ============ DATA ============ */
const ICONS={
compress:'<path d="M4 8l5 4-5 4M20 8l-5 4 5 4M12 4v16"/>',
convert:'<path d="M17 3l4 4-4 4M21 7H8a4 4 0 00-4 4M7 21l-4-4 4-4M3 17h13a4 4 0 004-4"/>',
pdf:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h4"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
doc:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
files:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
video:'<rect x="3" y="5" width="14" height="14" rx="3"/><path d="M17 10l4-2v8l-4-2"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',
sheet:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',
zip:'<path d="M5 4h14v16H5zM12 4v4M10 8h4M10 12h4M10 16h4"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.files}</svg>`;
const J="jpg,jpeg",P="png",W="webp",H="heic,heif",PDF="pdf",DOCX="doc,docx",XLS="xls,xlsx",PPT="ppt,pptx";
/* id|name|accepted ext|engine|icon|description (blank = auto)
   engines: c:<mime> canvas convert · q compress image · s resize · r rotate · cx choose format · a = server API */
const RAW=`compress-pdf|Compress PDF|${PDF}|a|pdf|Reduce the size of your PDF while keeping it readable.
compress-jpg|Compress JPG|${J}|c:image/jpeg|image|Shrink JPG photos with adjustable quality.
compress-png|Compress PNG|${P}|c:image/png|image|Optimize PNG images.
compress-webp|Compress WEBP|${W}|c:image/webp|image|Make WEBP images lighter.
compress-zip|Compress ZIP|zip|a|zip|Re-pack ZIP archives with stronger compression.
compress-video|Compress Video|mp4,mov,avi,mkv,webm|a|video|Reduce video size for sharing.
compress-docs|Compress Documents|${DOCX},${XLS},${PPT}|a|doc|Shrink Word, Excel and PowerPoint files.
word-pdf|Word → PDF|${DOCX}|a|doc|
excel-pdf|Excel → PDF|${XLS}|a|sheet|
ppt-pdf|PowerPoint → PDF|${PPT}|a|doc|
pdf-word|PDF → Word|${PDF}|a|pdf|
pdf-excel|PDF → Excel|${PDF}|a|sheet|
pdf-ppt|PDF → PowerPoint|${PDF}|a|pdf|
jpg-png|JPG → PNG|${J}|c:image/png|image|
png-jpg|PNG → JPG|${P}|c:image/jpeg|image|
webp-jpg|WEBP → JPG|${W}|c:image/jpeg|image|
jpg-webp|JPG → WEBP|${J}|c:image/webp|image|
png-webp|PNG → WEBP|${P}|c:image/webp|image|
webp-png|WEBP → PNG|${W}|c:image/png|image|
heic-jpg|HEIC → JPG|${H}|c:image/jpeg|image|
pdf-jpg|PDF → JPG|${PDF}|a|image|
jpg-pdf|JPG → PDF|${J}|a|image|
png-pdf|PNG → PDF|${P}|a|image|
html-pdf|HTML → PDF|html,htm|a|doc|
txt-pdf|TXT → PDF|txt|a|doc|
csv-excel|CSV → Excel|csv|a|sheet|
csv-pdf|CSV → PDF|csv|a|sheet|
merge-pdf|Merge PDF|${PDF}|a|pdf|Combine several PDFs into one document.
split-pdf|Split PDF|${PDF}|a|pdf|Separate a PDF into multiple files.
rotate-pdf|Rotate PDF|${PDF}|a|pdf|Rotate pages in a PDF.
delete-pages|Delete PDF Pages|${PDF}|a|pdf|Remove unwanted pages from a PDF.
extract-pages|Extract PDF Pages|${PDF}|a|pdf|Pull selected pages into a new PDF.
protect-pdf|Protect PDF|${PDF}|a|lock|Add a password to your PDF.
unlock-pdf|Unlock PDF|${PDF}|a|lock|Remove a password you know from a PDF.
watermark-pdf|Add Watermark|${PDF}|a|edit|Stamp text or an image on every page.
page-numbers|Add Page Numbers|${PDF}|a|edit|Number the pages of your PDF.
resize-image|Resize Image|${J},${P},${W}|s|image|Change image dimensions.
compress-image|Compress Image|${J},${P},${W}|q|image|Reduce image size with adjustable quality.
crop-image|Crop Image|${J},${P},${W}|a|image|Trim an image to the area you need.
rotate-image|Rotate Image|${J},${P},${W}|r|image|Rotate an image by 90° steps.
convert-image|Convert Image|${J},${P},${W},${H}|cx|image|Convert between JPG, PNG and WEBP.
image-pdf|Image → PDF|${J},${P},${W}|a|image|Turn images into a PDF.
zip-files|ZIP Files|*|a|zip|Bundle files into a ZIP archive.
unzip-files|Unzip Files|zip|a|zip|Extract the contents of a ZIP.
merge-files|Merge Files|*|a|files|Combine compatible files into one.
split-files|Split Files|*|a|files|Break a large file into parts.
rename-files|Rename Files|*|a|edit|Batch rename files.
file-converter|File Converter|*|a|convert|Convert a file to another format.
file-compressor|File Compressor|*|a|compress|Compress any file type.`;
const T={};
RAW.split("\n").forEach(l=>{const[id,name,acc,eng,icon,d]=l.split("|");
 const ex=acc==="*"?[]:acc.split(",");const m=name.split(" → ");
 T[id]={id,name,ex,eng,icon,
  desc:d||`Convert ${m[0]} files to ${m[1]} format.`,
  from:m.length>1?m[0]:ex.length?ex[0].toUpperCase():"File",to:m[1]||(id.startsWith("compress")?"Smaller":"Result")}});
const CATS=[
{id:"compress",title:"Compress",icon:"compress",desc:"Reduce file size without complicated software.",head:"Compress Files",sub:"Choose a file and reduce its size in seconds.",tools:"compress-pdf compress-jpg compress-png compress-webp compress-zip compress-video compress-docs"},
{id:"convert",title:"Convert",icon:"convert",desc:"Convert your files into the format you need.",head:"Convert Files",sub:"Pick a conversion and turn your file into a new format.",tools:"word-pdf excel-pdf ppt-pdf pdf-word pdf-excel pdf-ppt jpg-png png-jpg webp-jpg jpg-webp png-webp heic-jpg pdf-jpg jpg-pdf png-pdf html-pdf txt-pdf csv-excel csv-pdf"},
{id:"pdf",title:"PDF",icon:"pdf",desc:"Powerful tools for working with PDF files.",head:"PDF Tools",sub:"Merge, split, protect and convert PDFs.",tools:"merge-pdf split-pdf compress-pdf rotate-pdf delete-pages extract-pages pdf-word pdf-excel pdf-jpg word-pdf excel-pdf protect-pdf unlock-pdf watermark-pdf page-numbers"},
{id:"images",title:"Images",icon:"image",desc:"Convert, resize, optimize, and edit images.",head:"Image Tools",sub:"Convert, resize, optimize and edit your images.",tools:"jpg-png png-jpg jpg-webp png-webp webp-jpg webp-png heic-jpg resize-image compress-image crop-image rotate-image convert-image image-pdf"},
{id:"documents",title:"Documents",icon:"doc",desc:"Convert and manage your everyday documents.",head:"Document Tools",sub:"Convert office documents and spreadsheets.",tools:"word-pdf excel-pdf ppt-pdf pdf-word pdf-excel pdf-ppt txt-pdf csv-pdf csv-excel"},
{id:"files",title:"Files",icon:"files",desc:"Useful tools for everyday file management.",head:"File Tools",sub:"Everyday helpers for managing your files.",tools:"zip-files unzip-files merge-files split-files rename-files file-converter file-compressor"}];
CATS.forEach(c=>c.list=c.tools.split(" "));
const $=(s,r=document)=>r.querySelector(s);
const fmt=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};

/* ============ PROCESSING ENGINES ============ */
const loadBitmap=async f=>{try{return await createImageBitmap(f)}catch(e){
 return await new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{ok(i)};i.onerror=()=>no(new Error("This browser can't decode that image."));i.src=u})}};
async function canvasProcess(tool,file,o){
 const img=await loadBitmap(file);let w=img.width,h=img.height,mime=o.mime;
 if(tool.eng==="q")mime=file.type||"image/jpeg";
 if(tool.eng==="s"){const nw=Math.max(1,Math.round(+o.width||w));h=Math.round(h*nw/w);w=nw;mime=file.type||"image/png"}
 if(tool.eng==="r"&&(o.angle==90||o.angle==270))[w,h]=[h,w];
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
 if(mime==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,w,h)}
 if(tool.eng==="r"){x.translate(w/2,h/2);x.rotate(o.angle*Math.PI/180);x.drawImage(img,-img.width/2,-img.height/2)}else x.drawImage(img,0,0,w,h);
 const blob=await new Promise(r=>c.toBlob(r,mime,o.quality/100));
 if(!blob||blob.type!==mime)throw new Error(`Your browser can't export ${mime.split("/")[1].toUpperCase()}.`);
 const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[mime];
 return{blob,name:file.name.replace(/\.[^.]+$/,"")+(tool.eng==="s"?"-resized":tool.eng==="r"?"-rotated":tool.id.startsWith("compress")?"-squeezed":"")+"."+ext};
}
function remoteProcess(tool,file,o,onProg){
 return new Promise((ok,no)=>{
  const api=window.SqueezeAPI;
  if(api&&api.process)return Promise.resolve(api.process(tool.id,file,o,onProg)).then(ok,no);
  if(!CONFIG.API_BASE)return no(new Error("NOT_CONNECTED"));
  const fd=new FormData();fd.append("file",file);Object.entries(o).forEach(([k,v])=>fd.append(k,v));
  const x=new XMLHttpRequest();x.open("POST",`${CONFIG.API_BASE}/v1/${tool.id}`);x.responseType="blob";
  x.upload.onprogress=e=>e.lengthComputable&&onProg(e.loaded/e.total*100);
  x.onload=()=>x.status<300?ok({blob:x.response,name:(x.getResponseHeader("X-Filename"))||"squeeze-"+file.name}):no(new Error(`The server returned an error (${x.status}).`));
  x.onerror=()=>no(new Error("Network error. Check your connection and try again."));x.send(fd);
 });
}

/* ============ VIEWS ============ */
const nav=[["#/","Home"],...CATS.map(c=>["#/"+c.id,c.title])];
const catCard=c=>`<a class="card" href="#/${c.id}"><div class="ic">${ico(c.icon)}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="go"><span>${c.list.length} tools</span><span>Open →</span></div></a>`;
const toolCard=t=>`<a class="card tool" href="#/tool/${t.id}"><div class="ic">${ico(t.icon)}</div><h3>${t.name}</h3><p>${t.desc}</p></a>`;
const views={
home:()=>`<section class="hero"><span class="pill">Free file utilities</span><h1>Squeeze<br><mark>Everything you need for your files.</mark></h1>
<p class="lead">Compress, convert, merge, edit, and transform your files — all in one simple place.</p><a class="btn" href="#cats">Explore Tools ↓</a></section>
<section id="cats" style="padding:24px 0 96px"><div class="grid">${CATS.map(catCard).join("")}</div></section>`,
tools:()=>`<section class="page"><h2>All Tools</h2><p class="sub">Every Squeeze tool, grouped by category.</p>${CATS.map(c=>`<h3 style="margin:36px 0 14px">${c.title}</h3><div class="grid">${c.list.map(i=>toolCard(T[i])).join("")}</div>`).join("")}</section>`,
cat:c=>`<section class="page"><div class="crumb"><a href="#/">Home</a> / ${c.title}</div><h2>${c.head}</h2><p class="sub">${c.sub}</p><div class="grid">${c.list.map(i=>toolCard(T[i])).join("")}</div></section>`,
info:k=>{const t={privacy:["Privacy","Tools marked as running in your browser process files locally and never upload them. Tools that need a server upload the file only to the processing service you configure. Replace this text with your final policy."],terms:["Terms","Placeholder terms. Add your legal terms before launch."],contact:["Contact","Placeholder contact page. Add your support email or form here."]}[k];
 return`<section class="page"><div class="panel"><h2>${t[0]}</h2><p class="sub">${t[1]}</p></div></section>`}
};

/* ============ TOOL PAGE ============ */
function toolPage(t){
 const cat=CATS.find(c=>c.list.includes(t.id));
 const accept=t.ex.map(e=>"."+e).join(",");
 const local=t.eng!=="a";
 const isConv=t.name.includes("→");
 const root=el(`<section class="page"><div class="panel">
 <div class="crumb"><a href="#/">Home</a> / <a href="#/${cat.id}">${cat.title}</a> / ${t.name}</div>
 <h2>${isConv?"Convert "+t.name.replace(" → "," to "):t.name}</h2><p class="sub">${t.desc}</p>
 ${isConv?`<div class="route" aria-hidden="true"><div class="ft">${ico(t.icon)}${t.from}</div><span>→</span><div class="ft">${ico("doc")}${t.to}</div></div>`:""}
 <div id="stage"></div>
 <p class="note">${local?"✓ Runs entirely in your browser. Your file is not uploaded.":"This tool needs a server-side processing API."}</p></div></section>`);
 const stage=$("#stage",root);let file=null,out=null;
 const input=el(`<input type="file" class="sr" tabindex="-1" aria-hidden="true" ${accept?`accept="${accept}"`:""}>`);
 const err=m=>{const e=$(".err",stage);if(e)e.remove();stage.append(el(`<div class="err" role="alert">${m}</div>`))};
 function pick(){
  stage.innerHTML="";file=null;out=null;
  const d=el(`<div class="drop" role="button" tabindex="0" aria-label="Drop your file here or choose a file"><div class="ic" style="margin:0 auto">${ico("files")}</div><h3>Drop your file here</h3><p>or</p><span class="btn">Choose File</span><small>Supported formats: ${t.ex.length?t.ex.map(e=>e.toUpperCase()).join(", "):"any file"} · Max ${CONFIG.MAX_MB} MB</small></div>`);
  d.onclick=()=>input.click();d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click()}};
  d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over");take(e.dataTransfer.files[0])};
  stage.append(d,input);
 }
 input.onchange=()=>{take(input.files[0]);input.value=""};
 function take(f){
  if(!f)return;const ext=f.name.split(".").pop().toLowerCase();
  if(t.ex.length&&!t.ex.includes(ext)){err(`“${f.name}” isn't supported. Please choose: ${t.ex.map(e=>e.toUpperCase()).join(", ")}.`);return}
  if(f.size>CONFIG.MAX_MB*1048576){err(`That file is ${fmt(f.size)}. The limit is ${CONFIG.MAX_MB} MB.`);return}
  if(!f.size){err("That file is empty.");return}
  file=f;review();
 }
 function review(){
  stage.innerHTML="";
  let opts="";
  const q=`<label class="f" for="q">Quality: <span id="qv">75</span>%</label><input id="q" type="range" min="10" max="100" value="75">`;
  if(t.eng.startsWith("c:image/jpeg")||t.eng.startsWith("c:image/webp")||t.eng==="q"||t.eng==="cx")opts+=q;
  if(t.eng==="cx")opts=`<label class="f" for="fm">Output format</label><select id="fm"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select>`+q;
  if(t.eng==="s")opts=`<label class="f" for="w">New width (px) — height keeps its proportions</label><input id="w" type="number" min="1" max="10000" value="1024">`;
  if(t.eng==="r")opts=`<label class="f" for="an">Rotate clockwise</label><select id="an"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>`;
  const box=el(`<div class="box"><div class="file"><div class="ic" style="margin:0">${ico(t.icon)}</div><div><b></b><span>${fmt(file.size)}</span></div><button class="btn ghost x" type="button">Remove</button></div>${opts}<div class="actions"><button class="btn" type="button" id="go">${t.id.startsWith("compress")?"Compress":isConv?"Convert":"Process"}</button></div></div>`);
  $("b",box).textContent=file.name;
  $(".x",box).onclick=pick;
  const qs=$("#q",box);if(qs)qs.oninput=()=>$("#qv",box).textContent=qs.value;
  $("#go",box).onclick=()=>run(box);
  stage.append(box);$("#go",box).focus();
 }
 async function run(box){
  const o={quality:qs(box,"#q",75),mime:(t.eng.startsWith("c:")?t.eng.slice(2):$("#fm",box)?.value)||"image/png",width:$("#w",box)?.value,angle:+($("#an",box)?.value||90)};
  const st=el(`<div class="box" aria-live="polite"><b>Processing…</b><div class="bar ind" role="progressbar" aria-label="Processing"><i></i></div><span style="color:var(--mut);font-size:14px" id="msg">${local?"Working in your browser":"Uploading"}…</span></div>`);
  stage.innerHTML="";stage.append(st);
  const bar=$(".bar",st);
  try{
   out=local?await canvasProcess(t,file,o):await remoteProcess(t,file,o,p=>{bar.classList.remove("ind");$("i",bar).style.width=p+"%";$("#msg",st).textContent=p<100?"Uploading "+Math.round(p)+"%":"Processing on server…"});
   done();
  }catch(e){
   stage.innerHTML="";review();
   err(e.message==="NOT_CONNECTED"?`<b>Processing service not connected.</b> “${t.name}” needs a server-side API, and none is configured yet. Your file was not uploaded. Developers: set <code>CONFIG.API_BASE</code> or define <code>window.SqueezeAPI.process()</code>.`:(e.message||"Something went wrong. Please try again."));
  }
 }
 const qs=(b,s,d)=>{const e=$(s,b);return e?+e.value:d};
 function done(){
  stage.innerHTML="";
  const pct=Math.round((1-out.blob.size/file.size)*100);
  const smaller=pct>0;
  const box=el(`<div class="box"><b>✓ Done</b><div class="stats"><div><b>${fmt(file.size)}</b><span>Original</span></div><div><b>${fmt(out.blob.size)}</b><span>New size</span></div><div class="hl"><b>${smaller?"−"+pct+"%":pct===0?"0%":"+"+Math.abs(pct)+"%"}</b><span>${smaller?"Reduced":"Change"}</span></div></div>${!smaller&&t.id.startsWith("compress")?`<div class="note" style="margin:0 0 16px">This file couldn't be made smaller at these settings — it may already be well optimized.</div>`:""}<div class="actions"><a class="btn" id="dl" download>Download</a><button class="btn ghost" type="button" id="again">Start over</button></div></div>`);
  const dl=$("#dl",box);dl.href=URL.createObjectURL(out.blob);dl.download=out.name;
  $("#again",box).onclick=pick;stage.append(box);dl.focus();
 }
 pick();return root;
}

/* ============ ROUTER ============ */
const main=$("#main");
function setMeta(t,d){document.title=t+" — Squeeze";let m=$('meta[name=description]');if(m)m.content=d}
function route(){
 const h=location.hash.replace(/^#\/?/,"");const [a,b]=h.split("/");
 main.innerHTML="";let page="";
 if(a==="cats"||a==="")page="/";else page="/"+a;
 if(a==="tool"&&T[b]){main.append(toolPage(T[b]));setMeta(T[b].name,T[b].desc);page=null;const c=CATS.find(c=>c.list.includes(b));page="/"+c.id}
 else if(a==="tools"){main.innerHTML=views.tools();setMeta("All Tools","Browse every Squeeze file tool.")}
 else if(CATS.some(c=>c.id===a)){const c=CATS.find(c=>c.id===a);main.innerHTML=views.cat(c);setMeta(c.head,c.sub)}
 else if(["privacy","terms","contact"].includes(a)){main.innerHTML=views.info(a);setMeta(a,"Squeeze "+a)}
 else{main.innerHTML=views.home();document.title="Squeeze — Everything you need for your files"}
 $("#nav").innerHTML=nav.map(([u,l])=>`<a href="${u}" ${u==="#"+page||(u==="#/"&&page==="/")?'aria-current="page"':""}>${l}</a>`).join("");
 if(a!=="cats"){window.scrollTo(0,0);main.focus({preventScroll:true})}
 else $("#cats")?.scrollIntoView({behavior:"smooth"});
}
$("#fl").innerHTML=[["#/","Home"],["#/tools","All Tools"],["#/compress","Compress"],["#/convert","Convert"],["#/pdf","PDF"],["#/images","Images"],["#/documents","Documents"],["#/privacy","Privacy"],["#/terms","Terms"],["#/contact","Contact"]].map(([u,l])=>`<a href="${u}">${l}</a>`).join("");
addEventListener("hashchange",route);route();
</script>
